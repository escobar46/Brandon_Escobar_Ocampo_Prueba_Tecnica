spring.application.name=polizas

# Base de datos en memoria: se crea al arrancar y se borra al detener la app
spring.datasource.url=jdbc:h2:mem:polizasdb
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# Reglas de negocio
polizas.ipc=0.0500
polizas.api-key=123456

# CORE (en este ejercicio es el mock de esta misma app)
core.base-url=http://localhost:8080
core.timeout=2s

# Documentacion Swagger; en produccion se desactiva con false
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

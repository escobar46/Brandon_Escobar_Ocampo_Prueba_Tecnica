name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    name: Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar las pruebas
        run: ./mvnw -B test
